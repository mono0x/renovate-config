name: CI
on:
  push:
    branches:
      - "*"
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: hk check --all
        env:
          HK_PKL_BACKEND: pklr
