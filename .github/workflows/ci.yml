name: CI
on:
  push:
    branches:
      - "*"
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: hk check --all
        env:
          HK_PKL_BACKEND: pklr
