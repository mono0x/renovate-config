name: CI
on:
  push:
    branches:
      - "*"
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: hk check --all
        env:
          HK_PKL_BACKEND: pklr
