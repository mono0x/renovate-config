name: CI
on:
  push:
    branches:
      - "*"
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - run: hk check --all
        env:
          HK_PKL_BACKEND: pklr
